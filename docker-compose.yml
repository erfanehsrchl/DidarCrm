services:
  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${DIDARCRM_SQL_PASSWORD:-DidarCrm!Local123}"
    ports:
      - "1433:1433"
    volumes:
      - didarcrm-sql-data:/var/opt/mssql
      - ./scripts/local:/scripts/local:ro
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: "${DIDARCRM_RABBITMQ_USERNAME:-didarcrm}"
      RABBITMQ_DEFAULT_PASS: "${DIDARCRM_RABBITMQ_PASSWORD:-DidarCrm!Local123}"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - didarcrm-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  didarcrm-sql-data:
  didarcrm-rabbitmq-data:
